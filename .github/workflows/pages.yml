# Udgiver appen til GitHub Pages: hvert push til main spejles til
# gh-pages-branchen, som Pages serverer fra (Deploy from a branch).
name: Udgiv til GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Hent koden
        uses: actions/checkout@v4
      - name: Udgiv til gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch .nojekyll
          git add .nojekyll
          git commit -m "Udgivelse til GitHub Pages"
          git push origin HEAD:gh-pages --force
